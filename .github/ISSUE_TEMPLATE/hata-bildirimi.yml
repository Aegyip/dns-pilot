name: 🐞 Hata bildir
description: DNS Pilot'ta karşılaştığınız bir sorunu bildirin.
title: "[Hata] "
labels: ["hata"]
body:
  - type: markdown
    attributes:
      value: |
        Bildiriminiz için teşekkürler! Uygulamadaki **Hata bildir** düğmesiyle geldiyseniz sürüm bilgileri aşağıya kendiliğinden doldurulmuştur.
        Lütfen IP adresi, şifre gibi kişisel bilgileri paylaşmayın.
  - type: textarea
    id: sorun
    attributes:
      label: Ne oldu?
      description: Sorunu kısaca anlatın.
      placeholder: Örn. Zapret'i başlattığımda Discord açılmıyor.
    validations:
      required: true
  - type: textarea
    id: adimlar
    attributes:
      label: Nasıl tekrarlanır?
      placeholder: |
        1. Tepsi menüsünü açtım
        2. Zapret'i başlat'a tıkladım
        3. ...
    validations:
      required: true
  - type: textarea
    id: beklenen
    attributes:
      label: Ne olmasını bekliyordunuz?
  - type: input
    id: surum
    attributes:
      label: DNS Pilot sürümü
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows sürümü
  - type: input
    id: kurulum
    attributes:
      label: Kurulum türü
      placeholder: Microsoft Store / klasik kurulum
  - type: input
    id: zapret
    attributes:
      label: Zapret durumu
      description: Çalışıyor mu, hangi strateji seçili?
  - type: input
    id: isp
    attributes:
      label: İnternet servis sağlayıcınız (isteğe bağlı)
      description: Strateji sorunlarında yardımcı olur.
      placeholder: Örn. Türk Telekom, Superonline, Vodafone
  - type: textarea
    id: ekler
    attributes:
      label: Ekran görüntüsü veya ek bilgi
      description: Görselleri buraya sürükleyip bırakabilirsiniz.
